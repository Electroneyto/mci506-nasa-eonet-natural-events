name: NASA EONET Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  run-eonet-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google Cloud credentials file
        run: |
          printf '%s' '${{ secrets.GCP_SA_KEY }}' > gcp-key.json

      - name: Run NASA EONET extraction
        env:
          EONET_API_URL: https://eonet.gsfc.nasa.gov/api/v3/events
          EONET_STATUS: all
          EONET_DAYS: 365
          EONET_LIMIT: 5000
        run: |
          python scripts/extract.py

      - name: Show generated Parquet files
        run: |
          find data/bronze/eonet -type f -name "*.parquet"

      - name: Upload Parquet files to Google Cloud Storage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
        run: |
          python scripts/load.py
